# CPU fallback for machines without NVIDIA GPU. Slow but viable for the seed corpus.
# float16 is requested for parity with the GPU config; train_lora.py forces float32
# on CPU, since half precision is not usable for CPU training.
model:
  base: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: float16
  trust_remote_code: true

data:
  train_file: data/build/train.jsonl
  max_seq_length: 1024

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: checkpoints/kilimo-0.5b-lora
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 5
  save_strategy: epoch
  bf16: false
  fp16: false
  gradient_checkpointing: true
  report_to: none
  seed: 42
  dataloader_num_workers: 0

merge:
  merged_dir: merged/kilimo-0.5b
