# Kilimo LoRA SFT - run on a Linux GPU host (Colab T4 or better), not local Windows CPU.
# torch_dtype/bf16 below are downgraded automatically by scripts/train_lora.py on
# GPUs without bfloat16 support, so this config is safe to run on a T4.

model:
  base: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: true

data:
  train_file: data/build/train.jsonl
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: checkpoints/kilimo-0.5b-lora
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  bf16: true
  gradient_checkpointing: true
  report_to: none
  seed: 42

merge:
  merged_dir: merged/kilimo-0.5b
